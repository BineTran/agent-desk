[project]
name = "agent-desk"
version = "0.1.0"
description = "Local-first coding-agent harness with observable multi-agent orchestration"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "aiosqlite>=0.20",
  "typer>=0.12",
  "textual>=0.80",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-typesafe",
  "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agent-desk = "agent_desk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_desk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["codex: needs codex CLI + login", "agy: needs Antigravity CLI + login", "claude: needs claude CLI + login", "jev: needs TYPESAFE_API_KEY"]
addopts = "-m 'not codex and not claude and not jev and not agy'"
